[env:supermini]
platform = espressif32
; 构建期从 git 注入固件版本，见 version.py（别手工维护版本号，迟早漏改）
extra_scripts = pre:version.py
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; 不要写死端口号：macOS 换 USB 口会从 usbmodem101 变成 usbmodem2101
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
; C3 原生 USB Serial/JTAG 作为 Serial
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; 嵌入 12px 点阵字库（见 data/README.md）：内置字体只有 ASCII，
; hub 下发的中文会变乱码，所以把 GB2312 字库编进 flash。
; 符号名形如 _binary_data_hzk12_bin_start
board_build.embed_files =
    data/hzk12.bin
    data/u2g.bin

; 字库多占约 230KB，默认分区表（1.25MB app）会很紧。
; 我们是 USB 刷机、不用 OTA，直接换 3MB 单 app 分区。
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    links2004/WebSockets@^2.6.1


; 硬件探测用的临时环境，只编译 tools/oled_probe/，不含正式固件
[env:oledprobe]
extends = env:supermini
build_src_filter = -<*> +<../tools/oled_probe/>
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11


; 矩阵键盘探测，同样只编译自己的目录
[env:matrixprobe]
extends = env:supermini
build_src_filter = -<*> +<../tools/matrix_probe/>
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11

; 第三行异常定位
[env:matrixdiag]
extends = env:supermini
build_src_filter = -<*> +<../tools/matrix_diag/>
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11

; LED 接线与极性验证
[env:ledprobe]
extends = env:supermini
build_src_filter = -<*> +<../tools/led_probe/>
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11

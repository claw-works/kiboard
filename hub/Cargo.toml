[package]
name = "kiboard-hub"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
serde = { version = "1.0.229", features = ["derive"] }
regex = "1.11.1"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-serial = "5.5.0"
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lib]
name = "kiboard_hub"
path = "src/lib.rs"

# 服务端
[[bin]]
name = "kiboard-hub"
path = "src/main.rs"

# 客户端闸门：装在跑 agent 的机器上，由各客户端的 hook 调用
[[bin]]
name = "kiboard-ask"
path = "src/bin/ask.rs"
